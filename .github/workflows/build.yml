name: Build APK

# 触发条件：
#  - push 到 main
#  - 针对 main 的 PR
#  - 手动触发（仓库 Actions 页面 -> Run workflow）
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # 启用 Gradle 依赖/构建缓存，加速后续构建
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 直接使用 GitHub runner 预装的 Android SDK（licenses 已接受）。
      # API 37 平台目前只在 Google 的 canary(预览) 仓库中，包名为 android-37.0，
      # 先尝试手动安装；若失败则交给构建时 AGP 的 SDK 自动下载兜底。
      - name: Install Android platform 37 (best effort)
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi
          if [ -n "$SDKMANAGER" ]; then
            "$SDKMANAGER" --channel=3 --install "platforms;android-37.0" || true
            "$SDKMANAGER" --channel=3 --install "build-tools;37.0.0" || true
          fi

      # 项目强制要求 keystore/keystore.properties 存在（build.gradle.kts 直接加载）。
      # CI 使用调试签名构建；如需正式签名，在仓库 Settings -> Secrets and variables
      # 配置签名信息，并把下面两处替换为 secrets。
      - name: Generate debug keystore
        run: |
          mkdir -p keystore
          keytool -genkeypair -v \
            -keystore keystore/debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug, O=Android, C=US"

      - name: Write keystore.properties
        run: |
          cat > keystore/keystore.properties <<'EOF'
          storeFile=../keystore/debug.keystore
          storePassword=android
          keyAlias=androiddebugkey
          keyPassword=android
          EOF

      # app/proguard-rules.pro 引用 keystore/proguard-custom.txt 作为混淆字典，
      # 该文件为作者本地私有文件，未提交到仓库；这里生成一份占位字典。
      # 如需与作者一致的真实词表，可将字典内容放入 GitHub Secrets 并在此写入。
      - name: Create proguard obfuscation dictionary
        run: |
          cat > keystore/proguard-custom.txt <<'EOF'
          a
          b
          c
          d
          e
          f
          g
          h
          i
          j
          k
          l
          m
          n
          o
          p
          q
          r
          s
          t
          u
          v
          w
          x
          y
          z
          aa
          ab
          ac
          ad
          ae
          af
          ag
          EOF

      - name: Grant gradlew execute permission
        run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lucky-tool-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
